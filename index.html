  <title>🇺🇸 美國之旅 2026 | 行程 App</title>
  
  <!-- Web App & iOS PWA Dynamic Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="US Trip '26">
  <meta name="theme-color" content="#020617">
  <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/000000/airplane-emoji.png">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            brand: {
              400: '#38bdf8',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* iOS PWA iPhone 14 Pro Safe Areas & Ergonomic Layout */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 5rem);
    }
    
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Modern Dark Dynamic Glassmorphism */
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .glass-nav {
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .pulse-glow {
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }

    .task-checkbox:checked + label {
      text-decoration: line-through;
      color: #64748b;
    }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 antialiased min-h-screen">

  <!-- Shared App Header -->
  <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/60 pt-2 pb-3 px-4">
    <div class="max-w-md mx-auto">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center space-x-2">
          <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-sky-500/20 text-sky-400 border border-sky-500/30">
            iPhone 14 Pro
          </span>
          <span class="text-xs font-semibold text-slate-400">10-Day Trip</span>
        </div>
        <button id="todayBtn" onclick="jumpToToday()" class="px-3 py-1 bg-sky-600/20 hover:bg-sky-600/30 text-sky-400 border border-sky-500/30 rounded-full text-xs font-semibold flex items-center gap-1 active:scale-95 transition">
          <i data-lucide="compass" class="w-3.5 h-3.5"></i>
          <span>今天行程</span>
        </button>
      </div>

      <div class="flex items-baseline justify-between">
        <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2" id="headerPageTitle">
          <span>🇺🇸 美國之旅 2026</span>
        </h1>
        <span id="tripProgressText" class="text-xs font-medium text-slate-400">Day 1 / 10</span>
      </div>

      <!-- Horizontal Tab Scrollbar for Days (Only Visible on Timeline View) -->
      <div class="mt-3 flex space-x-2 overflow-x-auto hide-scrollbar py-1" id="dayTabsList">
        <!-- Dynamic Tabs Injected Here -->
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-md mx-auto w-full px-4 pt-4 pb-24 space-y-4">

    <!-- PAGE VIEW 1: TIMELINE (DEFAULT) -->
    <section id="viewTimeline" class="space-y-4">
      <!-- Day Overview Summary Box -->
      <div id="daySummaryCard" class="glass-card rounded-2xl p-4 relative overflow-hidden transition-all duration-300">
        <div class="flex justify-between items-start gap-2">
          <div>
            <span id="dayBadge" class="text-[11px] font-bold uppercase tracking-wider text-sky-400"></span>
            <h2 id="dayTitle" class="text-lg font-bold text-white mt-0.5"></h2>
          </div>
          <div id="dayLocationBadge" class="px-2.5 py-1 bg-slate-800/80 border border-slate-700/80 rounded-full text-xs text-sky-300 font-medium flex items-center gap-1 shrink-0">
            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-sky-400"></i>
            <span id="dayLocationText">--</span>
          </div>
        </div>

        <!-- Hotel Info Bar -->
        <div id="hotelBar" class="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs">
          <div class="flex items-center space-x-2 text-slate-300 truncate">
            <i data-lucide="bed" class="w-4 h-4 text-amber-400 shrink-0"></i>
            <span id="hotelText" class="truncate font-medium">--</span>
          </div>
          <a id="hotelMapBtn" href="#" target="_blank" class="shrink-0 px-2.5 py-1 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 rounded-lg text-[11px] font-medium flex items-center gap-1">
            <span>導航</span>
            <i data-lucide="external-link" class="w-3 h-3"></i>
          </a>
        </div>
      </div>

      <!-- Special Highlight Banner -->
      <div id="highlightBanner" class="hidden glass-card rounded-xl p-3 border-l-4 border-l-rose-500 bg-rose-950/20 flex items-center space-x-3">
        <div class="p-2 bg-rose-500/20 text-rose-400 rounded-lg shrink-0">
          <i data-lucide="heart" class="w-5 h-5"></i>
        </div>
        <div>
          <p class="text-xs font-bold text-rose-300" id="bannerTitle">Anniversary Highlights 🎉</p>
          <p class="text-[11px] text-slate-300" id="bannerSubtitle">Battello 晚餐（日落位觀賞曼哈頓夜景）</p>
        </div>
      </div>

      <!-- Timeline Section Header -->
      <div class="flex items-center justify-between px-1 pt-1">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-sky-400"></i>
          <span>詳細行程 Timeline</span>
        </h3>
        <span class="text-[11px] text-slate-500">點擊地址開啟 Google Maps</span>
      </div>

      <!-- Dynamic Timeline Container -->
      <div id="timelineContainer" class="space-y-3">
        <!-- Dynamic List Injected via JS -->
      </div>
    </section>

    <!-- PAGE VIEW 2: STANDBY FLIGHTS VIEW -->
    <section id="viewStandby" class="hidden space-y-4">
      <div class="flex justify-between items-center bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
        <div>
          <h2 class="text-sm font-bold text-white">候補航線管理</h2>
          <p class="text-[10px] text-slate-400">各區專屬色彩動態篩選與航班清單</p>
        </div>
        <button onclick="promptAddSector()" class="px-3 py-1.5 bg-sky-500 hover:bg-sky-600 text-white rounded-xl text-xs font-bold flex items-center gap-1 active:scale-95 transition shadow-lg shadow-sky-500/20">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>新增 Sector</span>
        </button>
      </div>

      <div id="standbySectorsContainer" class="space-y-4">
        <!-- Injected Dynamically via JS -->
      </div>
    </section>

    <!-- PAGE VIEW 3: HOTELS VIEW -->
    <section id="viewHotels" class="hidden space-y-3">
      <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
        <h2 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="bed" class="w-4 h-4 text-amber-400"></i>
          <span>全程住宿總覽 (Hotels Overview)</span>
        </h2>
        <p class="text-[10px] text-slate-400">10 天行程入住飯店地址與導航連結</p>
      </div>
      <div class="space-y-3" id="hotelModalList">
        <!-- Injected via JS -->
      </div>
    </section>

    <!-- PAGE VIEW 4: CHECKLIST VIEW -->
    <section id="viewChecklist" class="hidden space-y-3">
      <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
        <h2 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
          <span>出發前備忘 Checklist</span>
        </h2>
        <p class="text-[10px] text-slate-400">重要證件、預約證明與行李確認項</p>
      </div>
      <div class="space-y-2" id="checklistContainer">
        <!-- Dynamic Checklists Injected via JS -->
      </div>
    </section>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 z-50 glass-nav px-6 py-2">
    <div class="max-w-md mx-auto flex items-center justify-around">
      <button onclick="switchView('timeline')" id="navTimeline" class="flex flex-col items-center space-y-1 text-sky-400">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">每日行程</span>
      </button>

      <button onclick="switchView('standby')" id="navStandby" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="plane-landing" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">候補機位</span>
      </button>

        <i data-lucide="bed" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">酒店住宿</span>

      <button onclick="switchView('checklist')" id="navChecklist" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 relative">
        <i data-lucide="check-square" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">出發備忘</span>
      </button>
    </div>
  </nav>

  <!-- UNIFIED EDIT/ADD FLIGHT MODAL FORM -->
  <div id="flightFormModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass-card rounded-2xl w-full max-w-sm p-5 space-y-4 border border-slate-700 shadow-2xl relative">

          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="flightForm" onsubmit="handleFlightFormSubmit(event)" class="space-y-3">
        <input type="hidden" id="formSecId">
        <input type="hidden" id="formFlightId">

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Airline Code</label>
            <input type="text" id="formAirlineCode" required placeholder="例: AA" oninput="autoLookupAirline()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-sky-500 uppercase">
          </div>
          <div class="col-span-2">
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">航班號 Flight No.</label>
            <input type="text" id="formFlightNo" required placeholder="例: 2145" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-sky-500">
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">航空公司名稱 (自動對照)</label>
          <input type="text" id="formAirlineName" readonly placeholder="自動帶入 Airline Name" class="w-full bg-slate-900/50 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-400 focus:outline-none cursor-not-allowed">
        </div>

        <div class="flex gap-2">
          <div class="flex-1 min-w-0">
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">起飛時間 Departure</label>
            <input type="time" id="formDepTime" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex-1 min-w-0">
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Terminal</label>
            <input type="text" id="formTerminal" placeholder="例: Terminal B" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-sky-500">
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">報到 / Standby 時間</label>
          <input type="time" id="formCheckinTime" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-sky-500">
        </div>

        <div id="nycAirportSelectGroup">
          <label class="block text-[10px] font-bold text-amber-400 uppercase mb-1">紐約機場選擇 (NYC Sector)</label>
          <select id="formApt" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-amber-300 focus:outline-none focus:border-amber-500">
            <option value="EWR">EWR (Newark)</option>
            <option value="LGA">LGA (LaGuardia)</option>
            <option value="JFK">JFK (Kennedy)</option>
            <option value="ALL">ALL / 其他</option>
          </select>
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeFlightForm()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold hover:bg-slate-700">取消</button>
          <button type="submit" class="px-4 py-2 bg-sky-500 text-white rounded-xl text-xs font-bold hover:bg-sky-600 shadow-md shadow-sky-500/20">儲存變更</button>
        </div>
      </form>
    </div>
  </div>

    /* Helper function to convert YYYY-MM-DD or standard date string to formatted date (MM/DD (週日)) */
    function formatDateWithWeekday(dateStr) {
      if (!dateStr) return "";
      if (dateStr.includes("(") && dateStr.includes(")")) return dateStr; // Already formatted
      const parsed = new Date(dateStr);
      if (isNaN(parsed.getTime())) return dateStr;
      
      const month = String(parsed.getMonth() + 1).padStart(2, '0');
      const day = String(parsed.getDate()).padStart(2, '0');
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
      const weekday = weekdays[parsed.getDay()];
      return `${month}/${day} (${weekday})`;
    }

    /* Single Form Modal Logic */
    function openFlightForm(secId, flightId = null) {
      const sec = standbyData.find(s => s.id === secId);
      if (!sec) return;

      document.getElementById('formSecId').value = secId;
      document.getElementById('formFlightId').value = flightId || '';

      const nycGroup = document.getElementById('nycAirportSelectGroup');
      if (sec.isNyc) {
        nycGroup.classList.remove('hidden');
      } else {
        nycGroup.classList.add('hidden');
      }

      if (flightId) {
        const flight = sec.flights.find(f => f.id === flightId);
        if (flight) {
          document.getElementById('flightFormTitle').innerText = '編輯航班資料';
          document.getElementById('formAirlineCode').value = flight.airlineCode || '';
          document.getElementById('formFlightNo').value = flight.flightNo || '';
          document.getElementById('formDepTime').value = flight.depTime || '';
          document.getElementById('formTerminal').value = flight.terminal || '';
          document.getElementById('formCheckinTime').value = flight.checkinTime || '';
          document.getElementById('formApt').value = flight.apt || 'EWR';
          autoLookupAirline();
        }
      } else {
        document.getElementById('flightFormTitle').innerText = '新增候補航班';
        document.getElementById('flightForm').reset();
        document.getElementById('formSecId').value = secId;
        document.getElementById('formFlightId').value = '';
        document.getElementById('formAirlineName').value = '';
      }

      document.getElementById('flightFormModal').classList.remove('hidden');
      document.getElementById('flightFormModal').classList.add('flex');
    }

    function closeFlightForm() {
      const modal = document.getElementById('flightFormModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function handleFlightFormSubmit(e) {
      e.preventDefault();
      const secId = document.getElementById('formSecId').value;
      const flightId = document.getElementById('formFlightId').value;

      const sec = standbyData.find(s => s.id === secId);
      if (!sec) return;

      const code = document.getElementById('formAirlineCode').value.trim().toUpperCase();
      const flightData = {
        id: flightId || ("f-" + Date.now()),
        airlineCode: code,
        airline: airlineMapping[code] || "其他航空公司",
        flightNo: document.getElementById('formFlightNo').value.trim(),
        depTime: document.getElementById('formDepTime').value,
        terminal: document.getElementById('formTerminal').value,
        checkinTime: document.getElementById('formCheckinTime').value,
        apt: sec.isNyc ? document.getElementById('formApt').value : 'ALL'
      };

      if (flightId) {
        const idx = sec.flights.findIndex(f => f.id === flightId);
        if (idx !== -1) sec.flights[idx] = flightData;
      } else {
        sec.flights.push(flightData);
      }

      closeFlightForm();
      saveStandbyData();
    }

    function promptAddSector() {
      const title = prompt("請輸入新 Sector 航線名稱 (例: BOS - PHL):");
      if (!title) return;

      // Create a native hidden date picker dialog to select date seamlessly
      const dateInput = document.createElement("input");
      dateInput.type = "date";
      dateInput.value = "2026-10-20"; // Default
      dateInput.style.position = "fixed";
      dateInput.style.opacity = "0";
      document.body.appendChild(dateInput);

      dateInput.onchange = function() {
        const formattedDate = formatDateWithWeekday(dateInput.value);
        const isNyc = title.toUpperCase().includes("NYC") || title.toUpperCase().includes("EWR") || title.toUpperCase().includes("LGA") || title.toUpperCase().includes("JFK");
        
        standbyData.push({
          id: "sec-" + Date.now(),
          title: title,
          date: formattedDate,
          isNyc: isNyc,
          nycFilter: "ALL",
          isExpanded: true,
          flights: []
        });
        saveStandbyData();
        document.body.removeChild(dateInput);
      };

      dateInput.onblur = function() {
        if (document.body.contains(dateInput)) {
          document.body.removeChild(dateInput);
        }
      };

      if (typeof dateInput.showPicker === "function") {
        dateInput.showPicker();
      } else {
        dateInput.click();
      }
    }

    function editSectorDate(secId) {
      const sec = standbyData.find(s => s.id === secId);
      if (!sec) return;

      const dateInput = document.createElement("input");
      dateInput.type = "date";
      dateInput.style.position = "fixed";
      dateInput.style.opacity = "0";
      document.body.appendChild(dateInput);

      dateInput.onchange = function() {
        if (dateInput.value) {
          sec.date = formatDateWithWeekday(dateInput.value);
          saveStandbyData();
        }
        document.body.removeChild(dateInput);
      };

      dateInput.onblur = function() {
        if (document.body.contains(dateInput)) {
          document.body.removeChild(dateInput);
        }
      };

      if (typeof dateInput.showPicker === "function") {
        dateInput.showPicker();
      } else {
        dateInput.click();
      }
    }

        row.className = "flex items-center space-x-3 glass-card p-3 rounded-xl";
        row.innerHTML = `
          <input type="checkbox" id="${item.id}" ${item.checked ? 'checked' : ''} onchange="toggleCheck('${item.id}')" class="task-checkbox w-4 h-4 accent-sky-500 rounded border-slate-700 bg-slate-900">
          <label for="${item.id}" class="text-xs text-slate-200 flex-1 font-medium select-none cursor-pointer">${item.text}</label>
        `;
        container.appendChild(row);
      });
    }

    function toggleCheck(id) {
      const target = checklistData.find(c => c.id === id);
      if (target) target.checked = !target.checked;
    }

    function renderHotelsModal() {
      const container = document.getElementById("hotelModalList");
      container.innerHTML = "";
      
      const hotels = [
        { name: "Sheraton Toronto Airport Hotel", days: "10/16", addr: "801 Dixon Rd, Toronto, ON" },
        { name: "Sheraton Boston Hotel", days: "10/17 - 10/18", addr: "39 Dalton St, Boston, MA 02199" },
        { name: "Aloft Secaucus Meadowlands", days: "10/19 - 10/21", addr: "460 Harmon Meadow Blvd, Secaucus, NJ 07094" },
        { name: "Westin Jersey City Newport / Envue", days: "10/22 - 10/23", addr: "479 Washington Blvd, Jersey City, NJ 07310" },
        { name: "Boston Airport Hotel", days: "10/24", addr: "Boston Logan International Airport" }
      ];

      hotels.forEach(h => {
        const div = document.createElement("div");
        div.className = "glass-card p-3.5 rounded-xl space-y-1";
        div.innerHTML = `
          <div class="flex justify-between items-start">
            <h4 class="text-xs font-bold text-white">${h.name}</h4>
            <span class="text-[10px] font-semibold text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded-full border border-amber-400/20">${h.days}</span>
          </div>
          <p class="text-[11px] text-slate-400">${h.addr}</p>
          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h.addr)}" target="_blank" class="inline-flex items-center gap-1 text-[11px] text-sky-400 mt-1">
            <i data-lucide="map" class="w-3 h-3"></i> 地圖導航
          </a>
        `;
        container.appendChild(div);
      });
      lucide.createIcons();
    }

    function switchView(view) {
      // Hide all main section views
      document.getElementById('viewTimeline').classList.add('hidden');
      document.getElementById('viewStandby').classList.add('hidden');
      document.getElementById('viewHotels').classList.add('hidden');
      document.getElementById('viewChecklist').classList.add('hidden');

      const dayTabs = document.getElementById('dayTabsList');
      const progressText = document.getElementById('tripProgressText');

      // Reset Nav Button Styles
      ['navTimeline', 'navStandby', 'navHotels', 'navChecklist'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) {
          btn.className = "flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200";
        }
      });

      if (view === 'standby') {
        document.getElementById('viewStandby').classList.remove('hidden');
        document.getElementById('navStandby').className = "flex flex-col items-center space-y-1 text-sky-400";
        document.getElementById('headerPageTitle').innerHTML = '<span>候補機位 Standby</span>';
        dayTabs.classList.add('hidden');
        progressText.classList.add('hidden');
        renderStandbyView();
      } else if (view === 'hotels') {
        document.getElementById('viewHotels').classList.remove('hidden');
        document.getElementById('navHotels').className = "flex flex-col items-center space-y-1 text-sky-400";
        document.getElementById('headerPageTitle').innerHTML = '<span>酒店住宿 Hotels</span>';
        dayTabs.classList.add('hidden');
        progressText.classList.add('hidden');
      } else if (view === 'checklist') {
        document.getElementById('viewChecklist').classList.remove('hidden');
        document.getElementById('navChecklist').className = "flex flex-col items-center space-y-1 text-sky-400";
        document.getElementById('headerPageTitle').innerHTML = '<span>出發備忘 Checklist</span>';
        dayTabs.classList.add('hidden');
        progressText.classList.add('hidden');
      } else {
        document.getElementById('viewTimeline').classList.remove('hidden');
        document.getElementById('navTimeline').className = "flex flex-col items-center space-y-1 text-sky-400";
        document.getElementById('headerPageTitle').innerHTML = '<span>🇺🇸 美國之旅 2026</span>';
        dayTabs.classList.remove('hidden');
        progressText.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
