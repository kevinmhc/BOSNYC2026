<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🇺🇸 美國之旅 2026 | 行程 App</title>
  
  <!-- Web App & iOS PWA Dynamic Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="US Trip '26">
  <meta name="theme-color" content="#020617">
  <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/000000/airplane-emoji.png">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            brand: {
              400: '#38bdf8',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* iOS PWA Safe Areas & Mobile Optimizations */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 5rem);
    }
    
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Dark Dynamic Glassmorphism */
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .glass-nav {
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .pulse-glow {
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }

    .task-checkbox:checked + label {
      text-decoration: line-through;
      color: #64748b;
    }

    /* iOS Dark Mode Inputs fix */
    input[type="time"], input[type="date"], input[type="text"], select {
      color-scheme: dark;
      font-size: 16px !important;
      box-sizing: border-box;
      max-width: 100%;
      width: 100%;
    }

    input[type="time"] {
      -webkit-appearance: none;
      appearance: none;
    }

    @media (min-width: 648px) {
      input[type="time"], input[type="date"], input[type="text"], select {
        font-size: 14px !important;
      }
    }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 antialiased min-h-screen">

  <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/60 pt-2 pb-3 px-4">
    <div class="max-w-md mx-auto">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center space-x-2">
          <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-sky-500/20 text-sky-400 border border-sky-500/30">
            iPhone 14 Pro
          </span>
          <span class="text-xs font-semibold text-slate-400">10-Day Trip</span>
        </div>
        <button id="todayBtn" onclick="jumpToToday()" class="px-3 py-1 bg-sky-600/20 hover:bg-sky-600/30 text-sky-400 border border-sky-500/30 rounded-full text-xs font-semibold flex items-center gap-1 active:scale-95 transition">
          <i data-lucide="compass" class="w-3.5 h-3.5"></i>
          <span>今天行程</span>
        </button>
      </div>

      <div class="flex items-baseline justify-between">
        <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2" id="headerPageTitle">
          <span>🇺🇸 美國之旅 2026</span>
        </h1>
        <span id="tripProgressText" class="text-xs font-medium text-slate-400">Day 1 / 10</span>
      </div>

      <!-- Days Scrollbar Header -->
      <div class="mt-3 flex space-x-2 overflow-x-auto hide-scrollbar py-1" id="dayTabsList">
        <!-- Dynamic Tabs -->
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-md mx-auto w-full px-4 pt-4 pb-24 space-y-4">

    <!-- VIEW 1: TIMELINE -->
    <section id="viewTimeline" class="space-y-4">
      <div id="daySummaryCard" class="glass-card rounded-2xl p-4 relative overflow-hidden transition-all duration-300">
        <div class="flex justify-between items-start gap-2">
          <div>
            <span id="dayBadge" class="text-[11px] font-bold uppercase tracking-wider text-sky-400"></span>
            <h2 id="dayTitle" class="text-lg font-bold text-white mt-0.5"></h2>
          </div>
          <div id="dayLocationBadge" class="px-2.5 py-1 bg-slate-800/80 border border-slate-700/80 rounded-full text-xs text-sky-300 font-medium flex items-center gap-1 shrink-0">
            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-sky-400"></i>
            <span id="dayLocationText">--</span>
          </div>
        </div>

        <div id="hotelBar" class="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs">
          <div class="flex items-center space-x-2 text-slate-300 truncate">
            <i data-lucide="bed" class="w-4 h-4 text-amber-400 shrink-0"></i>
            <span id="hotelText" class="truncate font-medium">--</span>
          </div>
          <a id="hotelMapBtn" href="#" target="_blank" class="shrink-0 px-2.5 py-1 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 rounded-lg text-[11px] font-medium flex items-center gap-1">
            <span>導航</span>
            <i data-lucide="external-link" class="w-3 h-3"></i>
          </a>
        </div>
      </div>

      <div id="highlightBanner" class="hidden glass-card rounded-xl p-3 border-l-4 border-l-rose-500 bg-rose-950/20 flex items-center space-x-3">
        <div class="p-2 bg-rose-500/20 text-rose-400 rounded-lg shrink-0">
          <i data-lucide="heart" class="w-5 h-5"></i>
        </div>
        <div>
          <p class="text-xs font-bold text-rose-300" id="bannerTitle">Anniversary Highlights 🎉</p>
          <p class="text-[11px] text-slate-300" id="bannerSubtitle">Battello 晚餐（日落位觀賞曼哈頓夜景）</p>
        </div>
      </div>

      <div class="flex items-center justify-between px-1 pt-1">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-sky-400"></i>
          <span>詳細行程 Timeline</span>
        </h3>
        <span class="text-[11px] text-slate-500">點擊地址開啟 Google Maps</span>
      </div>

      <div id="timelineContainer" class="space-y-3">
        <!-- Injected via JS -->
      </div>
    </section>

    <!-- VIEW 2: STANDBY FLIGHTS -->
    <section id="viewStandby" class="hidden space-y-4">
      <div class="flex justify-between items-center bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
        <div>
          <h2 class="text-sm font-bold text-white">候補航線管理</h2>
          <p class="text-[10px] text-slate-400">完整涵蓋 BOS-NYC / YYZ-BOS / NYC-BOS / NYC-ORD</p>
        </div>
        <div class="flex gap-1.5">
          <button onclick="resetToDefaultStandbyList()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium flex items-center gap-1 active:scale-95 transition border border-slate-700">
            <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
            <span>重置</span>
          </button>
          <button onclick="promptAddSector()" class="px-3 py-1.5 bg-sky-500 hover:bg-sky-600 text-white rounded-xl text-xs font-bold flex items-center gap-1 active:scale-95 transition shadow-lg shadow-sky-500/20">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>新增 Sector</span>
          </button>
        </div>
      </div>

      <div id="standbySectorsContainer" class="space-y-4">
        <!-- Injected via JS -->
      </div>
    </section>

    <!-- VIEW 3: HOTELS VIEW -->
    <section id="viewHotels" class="hidden space-y-3">
      <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
        <h2 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="bed" class="w-4 h-4 text-amber-400"></i>
          <span>全程住宿總覽 (Hotels Overview)</span>
        </h2>
        <p class="text-[10px] text-slate-400">10 天行程入住飯店地址與導航連結</p>
      </div>
      <div class="space-y-3" id="hotelModalList">
        <!-- Injected via JS -->
      </div>
    </section>

    <!-- VIEW 4: CHECKLIST VIEW -->
    <section id="viewChecklist" class="hidden space-y-3">
      <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
        <h2 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
          <span>出發前備忘 Checklist</span>
        </h2>
        <p class="text-[10px] text-slate-400">重要證件、預約證明與行李確認項</p>
      </div>
      <div class="space-y-2" id="checklistContainer">
        <!-- Injected via JS -->
      </div>
    </section>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 z-50 glass-nav px-6 py-2">
    <div class="max-w-md mx-auto flex items-center justify-around">
      <button onclick="switchView('timeline')" id="navTimeline" class="flex flex-col items-center space-y-1 text-sky-400">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">每日行程</span>
      </button>

      <button onclick="switchView('standby')" id="navStandby" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="plane-landing" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">候補機位</span>
      </button>
      
      <button onclick="switchView('hotels')" id="navHotels" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="bed" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">酒店住宿</span>
      </button>

      <button onclick="switchView('checklist')" id="navChecklist" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 relative">
        <i data-lucide="check-square" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">出發備忘</span>
      </button>
    </div>
  </nav>

  <!-- Flight Form Modal -->
  <div id="flightFormModal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass-card rounded-2xl w-full max-w-sm p-5 space-y-4 border border-slate-700 shadow-2xl relative overflow-hidden">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-white flex items-center gap-1.5" id="flightFormTitle">
          <i data-lucide="plane-takeoff" class="w-4 h-4 text-sky-400"></i>
          <span>候補航班資料</span>
        </h3>
        <button onclick="closeFlightForm()" class="p-1.5 rounded-full text-slate-400 hover:text-white bg-slate-800 active:scale-95">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="flightForm" onsubmit="handleFlightFormSubmit(event)" class="space-y-3">
        <input type="hidden" id="formSecId">
        <input type="hidden" id="formFlightId">

        <div class="grid grid-cols-3 gap-2">
          <div class="min-w-0">
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Airline Code</label>
            <input type="text" id="formAirlineCode" required placeholder="例: AA" oninput="autoLookupAirline()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500 uppercase">
          </div>
          <div class="col-span-2 min-w-0">
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">航班號 Flight No.</label>
            <input type="text" id="formFlightNo" required placeholder="例: 2145" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
          </div>
        </div>

        <div class="min-w-0">
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">航空公司名稱 (自動對照)</label>
          <input type="text" id="formAirlineName" readonly placeholder="自動帶入 Airline Name" class="w-full bg-slate-900/50 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-400 focus:outline-none cursor-not-allowed">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div class="min-w-0 overflow-hidden">
            <label class="block text-[10px] font-bold text-sky-400 uppercase mb-1">起飛時間 (STD)</label>
            <input type="time" id="formDepTime" onchange="handleDepTimeChange()" class="w-full bg-slate-900 border border-sky-500/40 rounded-xl px-3 py-2 text-sm text-sky-300 font-semibold focus:outline-none focus:border-sky-400">
          </div>
          <div class="min-w-0 overflow-hidden">
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Terminal</label>
            <input type="text" id="formTerminal" placeholder="例: B" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
          </div>
        </div>

        <div class="min-w-0 overflow-hidden">
          <label class="block text-[10px] font-bold text-amber-400 uppercase mb-1">報到 / Standby 時間 (-2 hrs)</label>
          <input type="time" id="formCheckinTime" class="w-full bg-slate-900 border border-amber-500/40 rounded-xl px-3 py-2 text-sm text-amber-300 font-semibold focus:outline-none focus:border-amber-400">
        </div>

        <div id="nycAirportSelectGroup" class="min-w-0">
          <label class="block text-[10px] font-bold text-amber-400 uppercase mb-1">紐約機場選擇 (NYC Airport)</label>
          <select id="formApt" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-amber-300 focus:outline-none focus:border-amber-500">
            <option value="EWR">EWR (Newark)</option>
            <option value="LGA">LGA (LaGuardia)</option>
            <option value="JFK">JFK (Kennedy)</option>
            <option value="ALL">ALL / 其他</option>
          </select>
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeFlightForm()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold hover:bg-slate-700">取消</button>
          <button type="submit" class="px-4 py-2 bg-sky-500 text-white rounded-xl text-xs font-bold hover:bg-sky-600 shadow-md shadow-sky-500/20">儲存變更</button>
        </div>
      </form>
    </div>
  </div>

    /* Helper: Calculate -2h Standby Time */
    function calculateCheckinTime(depTimeStr) {
      if (!depTimeStr) return "";
      const parts = depTimeStr.split(":");
      if (parts.length !== 2) return "";
      let hours = parseInt(parts[0], 10);
      let minutes = parseInt(parts[1], 10);
      if (isNaN(hours) || isNaN(minutes)) return "";
      
      hours = hours - 2;
      if (hours < 0) hours += 24;
      
      return String(hours).padStart(2, '0') + ":" + String(minutes).padStart(2, '0');
    }

      const depTime = document.getElementById('formDepTime').value;
      const checkinInput = document.getElementById('formCheckinTime');
      if (depTime) {

        if (calculated) checkinInput.value = calculated;
      }

    let standbyData = JSON.parse(localStorage.getItem('us_trip_standby_data')) || defaultStandbyData;

    function saveStandbyData() {
      localStorage.setItem('us_trip_standby_data', JSON.stringify(standbyData));
      renderStandbyView();
    }

    function resetToDefaultStandbyList() {
      if (confirm("確定要重置為原始完整 Standby 清單？")) {
        standbyData = JSON.parse(JSON.stringify(defaultStandbyData));
        saveStandbyData();
      }
    }

    function toggleSectorExpand(secId) {
      const sec = standbyData.find(s => s.id === secId);
      if (sec) {
        sec.isExpanded = !(sec.isExpanded ?? true);
        saveStandbyData();
      }
    }

    function setNycFilter(secId, apt) {
      const sec = standbyData.find(s => s.id === secId);
      if (sec) {
        sec.nycFilter = apt;
        renderStandbyView();
      }
    }

    function setAirlineFilter(secId, code) {
      const sec = standbyData.find(s => s.id === secId);
      if (sec) {
        sec.airlineFilter = code;
        renderStandbyView();
      }
    }

    function editSectorDate(secId) {
      const sec = standbyData.find(s => s.id === secId);
      if (!sec) return;
      const newDate = prompt("修改航段日期 (例如: 10/19 (一)):", sec.date || "");
      if (newDate !== null) {
        sec.date = newDate;
        saveStandbyData();
      }
    }

    function promptAddSector() {
      const title = prompt("新增候補航段名稱 (例如: BOS - DCA):");
      if (!title) return;
      const date = prompt("航段日期 (例如: 10/20 (二)):") || "";
      const isNyc = confirm("此航段是否包含紐約地區機場 (EWR/LGA/JFK) 篩選？");

      const newSec = {
        id: "sec-" + Date.now(),
        title: title,
        date: date,
        isNyc: isNyc,
        nycFilter: "ALL",
        airlineFilter: "ALL",
        isExpanded: true,
        flights: []
      };

      standbyData.push(newSec);
      saveStandbyData();
    }

    function deleteSector(secId) {
      if (!confirm("確定要刪除整個航段及其所有候補航班？")) return;
      standbyData = standbyData.filter(s => s.id !== secId);
      saveStandbyData();
    }

    function openFlightForm(secId, flightId = null) {
      const modal = document.getElementById('flightFormModal');
      const title = document.getElementById('flightFormTitle');
      const formSecId = document.getElementById('formSecId');
      const formFlightId = document.getElementById('formFlightId');
      const nycGroup = document.getElementById('nycAirportSelectGroup');

      formSecId.value = secId;
      formFlightId.value = flightId || '';

      const sec = standbyData.find(s => s.id === secId);
      if (sec && sec.isNyc) {
        nycGroup.classList.remove('hidden');
      } else {
        nycGroup.classList.add('hidden');
      }

      if (flightId) {
        title.innerHTML = '<i data-lucide="edit" class="w-4 h-4 text-sky-400"></i><span>編輯候補航班</span>';
        const flight = sec.flights.find(f => f.id === flightId);
        if (flight) {
          document.getElementById('formAirlineCode').value = flight.airlineCode || '';
          document.getElementById('formFlightNo').value = flight.flightNo || '';
          document.getElementById('formDepTime').value = flight.depTime || '';
          document.getElementById('formTerminal').value = flight.terminal || '';
          document.getElementById('formCheckinTime').value = flight.checkinTime || '';
          document.getElementById('formApt').value = flight.apt || 'EWR';
          autoLookupAirline();
        }
      } else {
        title.innerHTML = '<i data-lucide="plane-takeoff" class="w-4 h-4 text-sky-400"></i><span>新增候補航班</span>';
        document.getElementById('flightForm').reset();
        document.getElementById('formAirlineName').value = '';
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    }

    function closeFlightForm() {
      const modal = document.getElementById('flightFormModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function handleFlightFormSubmit(e) {
      e.preventDefault();
      const secId = document.getElementById('formSecId').value;
      const flightId = document.getElementById('formFlightId').value;

      const sec = standbyData.find(s => s.id === secId);
      if (!sec) return;

      const airlineCode = document.getElementById('formAirlineCode').value.trim().toUpperCase();
      const flightNo = document.getElementById('formFlightNo').value.trim();
      const depTime = document.getElementById('formDepTime').value;
      const terminal = document.getElementById('formTerminal').value.trim();
      let checkinTime = document.getElementById('formCheckinTime').value;
      const apt = document.getElementById('formApt').value;

      if (!checkinTime && depTime) {
        checkinTime = calculateCheckinTime(depTime);
      }

      if (flightId) {
        const flight = sec.flights.find(f => f.id === flightId);
        if (flight) {
          flight.airlineCode = airlineCode;
          flight.flightNo = flightNo;
          flight.depTime = depTime;
          flight.terminal = terminal;
          flight.checkinTime = checkinTime;
          flight.apt = apt;
        }
      } else {
        sec.flights.push({
          id: "f-" + Date.now(),
          airlineCode,
          flightNo,
          depTime,
          terminal,
          checkinTime,
          apt
        });
      }

      saveStandbyData();
      closeFlightForm();
    }

    function deleteFlight(secId, flightId) {
      const sec = standbyData.find(s => s.id === secId);
      if (!sec) return;
      sec.flights = sec.flights.filter(f => f.id !== flightId);
      saveStandbyData();
    }

    function renderTabs() {
      const container = document.getElementById("dayTabsList");
      if (!container) return;
      container.innerHTML = "";
      
      tripData.forEach((data, idx) => {
        const btn = document.createElement("button");
        btn.className = `px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all flex flex-col items-center ${
          idx === currentDayIndex 
            ? "bg-sky-500 text-white pulse-glow" 
            : "bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-700"
        }`;
        btn.onclick = () => selectDay(idx);
        btn.innerHTML = `
          <span>Day ${data.day}</span>
          <span class="text-[9px] font-normal opacity-80">${data.date.split(" ")[0]}</span>
        `;
        container.appendChild(btn);
      });
    }

    function selectDay(index) {
      currentDayIndex = index;
      renderTabs();
      renderDay(index);
    }

    function renderDay(index) {
      const data = tripData[index];
      if (!data) return;
      
      document.getElementById("tripProgressText").innerText = `Day ${data.day} / 10`;
      document.getElementById("dayBadge").innerText = `DAY ${data.day} • ${data.date}`;
      document.getElementById("dayTitle").innerText = data.title;
      document.getElementById("dayLocationText").innerText = data.location;
      document.getElementById("hotelText").innerText = data.hotel;
      document.getElementById("hotelMapBtn").href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.hotelAddr)}`;

      const banner = document.getElementById("highlightBanner");
      if (data.highlight) {
        banner.classList.remove("hidden");
      } else {
        banner.classList.add("hidden");
      }

      const timeline = document.getElementById("timelineContainer");
      timeline.innerHTML = "";

      data.events.forEach(evt => {
        const item = document.createElement("div");
        item.className = "glass-card rounded-xl p-3 flex items-start space-x-3 hover:border-slate-700 transition";
        
        let iconName = "map-pin";
        let iconBg = "bg-sky-500/10 text-sky-400 border-sky-500/20";
        
        if (evt.tag === "flight") { iconName = "plane"; iconBg = "bg-indigo-500/10 text-indigo-400 border-indigo-500/20"; }
        else if (evt.tag === "hotel") { iconName = "bed"; iconBg = "bg-amber-500/10 text-amber-400 border-amber-500/20"; }
        else if (evt.tag === "food") { iconName = "utensils"; iconBg = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20"; }
        else if (evt.tag === "shopping") { iconName = "shopping-bag"; iconBg = "bg-purple-500/10 text-purple-400 border-purple-500/20"; }
        else if (evt.tag === "heart") { iconName = "heart"; iconBg = "bg-rose-500/10 text-rose-400 border-rose-500/20"; }

        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(evt.location || evt.name)}`;

        item.innerHTML = `
          <div class="flex flex-col items-center shrink-0">
            <span class="text-[11px] font-bold text-sky-400 mb-1">${evt.time}</span>
            <div class="w-8 h-8 rounded-lg border ${iconBg} flex items-center justify-center">

        timeline.appendChild(item);

      lucide.createIcons();

        document.getElementById('navStandby').className = "flex flex-col items-center space-y-1 text-sky-400";
        document.getElementById('headerPageTitle').innerHTML = '<span>候補機位 Standby</span>';
        dayTabs.classList.add('hidden');
        progressText.classList.add('hidden');
        renderStandbyView();
      } else if (view === 'hotels') {
        document.getElementById('viewHotels').classList.remove('hidden');
        document.getElementById('navHotels').className = "flex flex-col items-center space-y-1 text-sky-400";
        document.getElementById('headerPageTitle').innerHTML = '<span>酒店住宿 Hotels</span>';
        dayTabs.classList.add('hidden');
        progressText.classList.add('hidden');
      } else if (view === 'checklist') {
        document.getElementById('viewChecklist').classList.remove('hidden');
        document.getElementById('navChecklist').className = "flex flex-col items-center space-y-1 text-sky-400";
        document.getElementById('headerPageTitle').innerHTML = '<span>出發備忘 Checklist</span>';
        dayTabs.classList.add('hidden');
        progressText.classList.add('hidden');
      } else {
        document.getElementById('viewTimeline').classList.remove('hidden');
        document.getElementById('navTimeline').className = "flex flex-col items-center space-y-1 text-sky-400";
        document.getElementById('headerPageTitle').innerHTML = '<span>🇺🇸 美國之旅 2026</span>';
        dayTabs.classList.remove('hidden');
        progressText.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
