<!DOCTYPE html>
<html lang="zh-HK" class="h-full bg-slate-950 text-slate-100 dark selection:bg-sky-500 selection:text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🇺🇸 美國之旅 2026 | 行程 App</title>
  
  <!-- Web App & iOS PWA Dynamic Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="US Trip '26">
  <meta name="theme-color" content="#020617">
  <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/000000/airplane-emoji.png">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            brand: {
              400: '#38bdf8',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* iOS PWA Safe Areas & Mobile Optimizations */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 5.5rem);
    }
    
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .glass-nav {
      background: rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pulse-glow {
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }

    .task-checkbox:checked + label {
      text-decoration: line-through;
      color: #64748b;
    }

    input[type="time"], input[type="date"], input[type="text"], select, textarea {
      color-scheme: dark;
      font-size: 16px !important;
      box-sizing: border-box;
      max-width: 100%;
      width: 100%;
    }

    input[type="time"] {
      -webkit-appearance: none;
      appearance: none;
    }

    @media (min-width: 648px) {
      input[type="time"], input[type="date"], input[type="text"], select, textarea {
        font-size: 14px !important;
      }
    }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 antialiased min-h-screen">

  <header class="sticky top-0 z-40 bg-slate-950/85 backdrop-blur-xl border-b border-slate-800/80 pt-2 pb-3 px-4">
    <div class="max-w-md mx-auto">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center space-x-2">
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-sky-500/20 text-sky-400 border border-sky-500/30">
            iPhone 14 Pro
          </span>
          <span id="tripTotalDaysBadge" class="text-xs font-medium text-slate-300">10-Day Trip</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="resetTripData()" title="重置全部行程" class="px-2.5 py-1 bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 border border-rose-500/30 rounded-full text-xs font-semibold flex items-center gap-1 active:scale-95 transition">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            <span>重置</span>
          </button>
          <button id="todayBtn" onclick="jumpToToday()" class="px-3 py-1 bg-sky-600/20 hover:bg-sky-600/30 text-sky-400 border border-sky-500/30 rounded-full text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
            <i data-lucide="compass" class="w-4 h-4"></i>
            <span>今天</span>
          </button>
        </div>
      </div>

      <div class="flex items-baseline justify-between">
        <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2" id="headerPageTitle">
          <span>🇺🇸 美國之旅 2026</span>
        </h1>
        <span id="tripProgressText" class="text-xs font-semibold text-slate-300">Day 1 / 10</span>
      </div>

      <!-- Days Scrollbar Header -->
      <div class="mt-3 flex space-x-2 overflow-x-auto hide-scrollbar py-1 items-center" id="dayTabsList">
        <!-- Dynamic Tabs -->
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-md mx-auto w-full px-4 pt-4 pb-24 space-y-4">

    <!-- VIEW 1: TIMELINE -->
    <section id="viewTimeline" class="space-y-4">
      <div id="daySummaryCard" class="glass-card rounded-2xl p-4 relative overflow-hidden transition-all duration-300 space-y-3">
        <div class="flex justify-between items-start gap-2">
          <div>
            <span id="dayBadge" class="text-xs font-bold uppercase tracking-wider text-sky-400"></span>
            <h2 id="dayTitle" class="text-lg font-bold text-white mt-0.5"></h2>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <div id="dayLocationBadge" class="px-3 py-1 bg-slate-800/80 border border-slate-700/80 rounded-full text-xs text-sky-300 font-semibold flex items-center gap-1.5">
              <i data-lucide="map-pin" class="w-4 h-4 text-sky-400"></i>
              <span id="dayLocationText">--</span>
            </div>
          </div>
        </div>

        <div id="hotelBar" class="pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs">
          <div class="flex items-center space-x-2 text-slate-200 truncate pr-2">
            <i data-lucide="bed" class="w-4 h-4 text-amber-400 shrink-0"></i>
            <span id="hotelText" class="truncate font-semibold">--</span>
          </div>
          <a id="hotelMapBtn" href="#" target="_blank" class="shrink-0 px-3 py-1 bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/30 text-amber-300 rounded-lg text-xs font-semibold flex items-center gap-1">
            <span>導航</span>
            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
          </a>
        </div>

        <!-- Day Management Actions Bar -->
        <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between gap-2 text-xs">
          <button onclick="openDayEditModal(currentDayIndex)" class="flex-1 py-1.5 bg-sky-500/15 hover:bg-sky-500/25 text-sky-300 border border-sky-500/30 rounded-xl font-bold flex items-center justify-center gap-1 transition">
            <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
            <span>編輯當天資料</span>
          </button>
          <button onclick="deleteCurrentDay()" class="px-3 py-1.5 bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 border border-rose-500/30 rounded-xl font-bold flex items-center gap-1 transition" title="刪除這天行程">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            <span>刪除天</span>
          </button>
        </div>
      </div>

      <div id="highlightBanner" class="hidden glass-card rounded-xl p-3.5 border-l-4 border-l-rose-500 bg-rose-950/25 flex items-center space-x-3">
        <div class="p-2 bg-rose-500/20 text-rose-400 rounded-xl shrink-0">
          <i data-lucide="heart" class="w-5 h-5"></i>
        </div>
        <div>
          <p class="text-xs font-bold text-rose-300" id="bannerTitle">Anniversary Highlights 🎉</p>
          <p class="text-xs text-slate-200 mt-0.5" id="bannerSubtitle">Battello 晚餐（日落位觀賞曼哈頓夜景）</p>
        </div>
      </div>

      <div class="flex items-center justify-between px-1 pt-1">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
          <i data-lucide="clock" class="w-4 h-4 text-sky-400"></i>
          <span>詳細行程 Timeline</span>
        </h3>
        <button onclick="openEventModal(currentDayIndex, null)" class="px-3 py-1.5 bg-sky-500 hover:bg-sky-600 text-white rounded-xl text-xs font-bold flex items-center gap-1 shadow-lg shadow-sky-500/20 active:scale-95 transition">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>新增活動</span>
        </button>
      </div>

      <div id="timelineContainer" class="space-y-3">
        <!-- Injected via JS -->
      </div>
    </section>

    <!-- VIEW 2: STANDBY FLIGHTS -->
    <section id="viewStandby" class="hidden space-y-4">
      <div class="flex justify-between items-center bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800">
        <div>
          <h2 class="text-sm font-bold text-white">候補航線管理</h2>
          <p class="text-xs text-slate-300 mt-0.5">支援 Airline、NYC 機場及 Terminal 篩選</p>
        </div>
        <div class="flex gap-1.5">
          <button onclick="resetToDefaultStandbyList()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold flex items-center gap-1 active:scale-95 transition border border-slate-700">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            <span>重置</span>
          </button>
          <button onclick="promptAddSector()" class="px-3 py-1.5 bg-sky-500 hover:bg-sky-600 text-white rounded-xl text-xs font-bold flex items-center gap-1 active:scale-95 transition shadow-lg shadow-sky-500/20">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>新增 Sector</span>
          </button>
        </div>
      </div>

      <div id="standbySectorsContainer" class="space-y-4">
        <!-- Injected via JS -->
      </div>
    </section>

    <!-- VIEW 3: HOTELS VIEW -->
    <section id="viewHotels" class="hidden space-y-3">
      <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800">
        <h2 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="bed" class="w-4 h-4 text-amber-400"></i>
          <span>全程住宿總覽 (Hotels Overview)</span>
        </h2>
        <p class="text-xs text-slate-300 mt-0.5">10 天行程入住飯店地址與導航連結</p>
      </div>
      <div class="space-y-3" id="hotelModalList">
        <!-- Injected via JS -->
      </div>
    </section>

    <!-- VIEW 4: CHECKLIST VIEW -->
    <section id="viewChecklist" class="hidden space-y-3">
      <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800">
        <h2 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
          <span>出發前備忘 Checklist</span>
        </h2>
        <p class="text-xs text-slate-300 mt-0.5">重要證件、預約證明與行李確認項</p>
      </div>
      <div class="space-y-2.5" id="checklistContainer">
        <!-- Injected via JS -->
      </div>
    </section>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 z-50 glass-nav px-4 py-2.5">
    <div class="max-w-md mx-auto flex items-center justify-around">
      <button onclick="switchView('timeline')" id="navTimeline" class="flex flex-col items-center space-y-1 text-sky-400">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-xs font-semibold">每日行程</span>
      </button>

      <button onclick="switchView('standby')" id="navStandby" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="plane-landing" class="w-5 h-5"></i>
        <span class="text-xs font-semibold">候補機位</span>
      </button>
      
      <button onclick="switchView('hotels')" id="navHotels" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="bed" class="w-5 h-5"></i>
        <span class="text-xs font-semibold">酒店住宿</span>
      </button>

      <button onclick="switchView('checklist')" id="navChecklist" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 relative">
        <i data-lucide="check-square" class="w-5 h-5"></i>
        <span class="text-xs font-semibold">出發備忘</span>
      </button>
    </div>
  </nav>

  <!-- Day Edit Modal -->
  <div id="dayEditModal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass-card rounded-2xl w-full max-w-sm p-5 space-y-4 border border-slate-700 shadow-2xl relative">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
          <i data-lucide="calendar" class="w-4 h-4 text-sky-400"></i>
          <span id="dayModalTitleText">編輯天資料</span>
        </h3>
        <button onclick="closeDayEditModal()" class="p-1.5 rounded-full text-slate-400 hover:text-white bg-slate-800 active:scale-95">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="dayEditForm" onsubmit="handleDayEditSubmit(event)" class="space-y-3">
        <input type="hidden" id="editDayIndex">

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Day 編號</label>
            <input type="number" id="formDayNo" required min="1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase mb-1">日期 (例: 10/16 (五))</label>
            <input type="text" id="formDayDate" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">當天標題 / 主題</label>
          <input type="text" id="formDayTitle" required placeholder="例: 香港 → Toronto 啟程" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">所在地 / City</label>
          <input type="text" id="formDayLocation" required placeholder="例: Toronto, Canada" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-amber-400 uppercase mb-1">當晚酒店名稱</label>
            <input type="text" id="formDayHotel" placeholder="酒店名稱" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
          </div>
          <div>
            <label class="block text-xs font-bold text-amber-400 uppercase mb-1">酒店地址 (導航用)</label>
            <input type="text" id="formDayHotelAddr" placeholder="例: 801 Dixon Rd" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
          </div>
        </div>

        <div class="flex items-center space-x-2 pt-1">
          <input type="checkbox" id="formDayHighlight" class="w-4 h-4 accent-rose-500 rounded bg-slate-900 border-slate-700">
          <label for="formDayHighlight" class="text-xs font-bold text-rose-300">設定為特別高亮日 (Anniversary / Highlight)</label>
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeDayEditModal()" class="px-4 py-2 bg-slate-800 text-slate-200 rounded-xl text-xs font-semibold hover:bg-slate-700">取消</button>
          <button type="submit" class="px-4 py-2 bg-sky-500 text-white rounded-xl text-xs font-bold hover:bg-sky-600 shadow-md shadow-sky-500/20">儲存變更</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Event Edit Modal -->
  <div id="eventEditModal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass-card rounded-2xl w-full max-w-sm p-5 space-y-4 border border-slate-700 shadow-2xl relative">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-white flex items-center gap-1.5" id="eventModalTitleText">
          <i data-lucide="clock" class="w-4 h-4 text-sky-400"></i>
          <span>新增 / 編輯活動</span>
        </h3>
        <button onclick="closeEventModal()" class="p-1.5 rounded-full text-slate-400 hover:text-white bg-slate-800 active:scale-95">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="eventEditForm" onsubmit="handleEventEditSubmit(event)" class="space-y-3">
        <input type="hidden" id="eventDayIndex">
        <input type="hidden" id="eventItemIndex">

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase mb-1">時間 (Time)</label>
            <input type="text" id="formEvtTime" required placeholder="例: 19:10 或 上午" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase mb-1">標籤分類 Tag</label>
            <select id="formEvtTag" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-sm text-white">
              <option value="spot">景點 (Spot)</option>
              <option value="food">美食 (Food)</option>
              <option value="flight">航班 (Flight)</option>
              <option value="hotel">酒店 (Hotel)</option>
              <option value="shopping">購物 (Shopping)</option>
              <option value="transport">交通 (Transport)</option>
              <option value="heart">特別/紀念 (Heart)</option>
              <option value="activity">活動 (Activity)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">活動名稱</label>
          <input type="text" id="formEvtName" required placeholder="例: Tatte Bakery & Cafe" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">詳細描述 Description</label>
          <textarea id="formEvtDesc" rows="2" placeholder="活動細節..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white resize-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-sky-400 uppercase mb-1">導航地點 / 地址 (Google Maps)</label>
          <input type="text" id="formEvtLocation" placeholder="例: 428 Harrison Ave, Boston, MA" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeEventModal()" class="px-4 py-2 bg-slate-800 text-slate-200 rounded-xl text-xs font-semibold hover:bg-slate-700">取消</button>
          <button type="submit" class="px-4 py-2 bg-sky-500 text-white rounded-xl text-xs font-bold hover:bg-sky-600 shadow-md shadow-sky-500/20">儲存活動</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Flight Form Modal -->
  <div id="flightFormModal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass-card rounded-2xl w-full max-w-sm p-5 space-y-4 border border-slate-700 shadow-2xl relative overflow-hidden">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-white flex items-center gap-1.5" id="flightFormTitle">
          <i data-lucide="plane-takeoff" class="w-4 h-4 text-sky-400"></i>
          <span>候補航班資料</span>
        </h3>
        <button onclick="closeFlightForm()" class="p-1.5 rounded-full text-slate-400 hover:text-white bg-slate-800 active:scale-95">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="flightForm" onsubmit="handleFlightFormSubmit(event)" class="space-y-3">
        <input type="hidden" id="formSecId">
        <input type="hidden" id="formFlightId">

        <div class="grid grid-cols-3 gap-2">
          <div class="min-w-0">
            <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Airline Code</label>
            <input type="text" id="formAirlineCode" required placeholder="例: AA" oninput="autoLookupAirline()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white uppercase">
          </div>
          <div class="col-span-2 min-w-0">
            <label class="block text-xs font-bold text-slate-300 uppercase mb-1">航班號 Flight No.</label>
            <input type="text" id="formFlightNo" required placeholder="例: 2145" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
          </div>
        </div>

        <div class="min-w-0">
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">航空公司名稱 (自動對照)</label>
          <input type="text" id="formAirlineName" readonly placeholder="自動帶入 Airline Name" class="w-full bg-slate-900/50 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-300 cursor-not-allowed">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div class="min-w-0 overflow-hidden">

    function calculateCheckinTime(depTimeStr) {
      if (!depTimeStr) return "";
      const parts = depTimeStr.split(":");
      if (parts.length !== 2) return "";
      let hours = parseInt(parts[0], 10);
      let minutes = parseInt(parts[1], 10);
      if (isNaN(hours) || isNaN(minutes)) return "";
      
      hours = hours - 2;
      if (hours < 0) hours += 24;
      
      return String(hours).padStart(2, '0') + ":" + String(minutes).padStart(2, '0');
    }

    let standbyData = JSON.parse(localStorage.getItem('us_trip_standby_data')) || defaultStandbyData;

    function saveStandbyData() {
      localStorage.setItem('us_trip_standby_data', JSON.stringify(standbyData));
      renderStandbyView();
    }

    function resetToDefaultStandbyList() {
      if (confirm("確定要重置為原始完整 Standby 清單？")) {
        standbyData = JSON.parse(JSON.stringify(defaultStandbyData));
        saveStandbyData();
      }
    }

    function toggleSectorExpand(secId) {
      const sec = standbyData.find(s => s.id === secId);
      if (sec) {
        sec.isExpanded = !(sec.isExpanded ?? true);
        saveStandbyData();
      }
    }

    function setNycFilter(secId, apt) {
      const sec = standbyData.find(s => s.id === secId);
      if (sec) {
        sec.nycFilter = apt;
        renderStandbyView();
      }
    }

    function setAirlineFilter(secId, code) {
      const sec = standbyData.find(s => s.id === secId);
      if (sec) {
        sec.airlineFilter = code;
        renderStandbyView();
      }
    }

    function setTerminalFilter(secId, term) {
      const sec = standbyData.find(s => s.id === secId);
      if (sec) {
        sec.terminalFilter = term;
        renderStandbyView();
      }
    }

    function editSectorDate(secId) {
      const sec = standbyData.find(s => s.id === secId);
      if (!sec) return;
      const newDate = prompt("修改航段日期 (例如: 10/19 (一)):", sec.date || "");
      if (newDate !== null) {
        sec.date = newDate;
        saveStandbyData();
      }
    }

    function promptAddSector() {
      const title = prompt("新增候補航段名稱 (例如: BOS - DCA):");
      if (!title) return;
      const date = prompt("航段日期 (例如: 10/20 (二)):") || "";
      const isNyc = confirm("此航段是否包含紐約地區機場 (EWR/LGA/JFK) 篩選？");

      const newSec = {
        id: "sec-" + Date.now(),
        title: title,
        date: date,
        isNyc: isNyc,
        nycFilter: "ALL",
        airlineFilter: "ALL",
        terminalFilter: "ALL",
        isExpanded: true,
        flights: []
      };

      standbyData.push(newSec);
      saveStandbyData();
    }

    function deleteSector(secId) {
      if (!confirm("確定要刪除整個航段及其所有候補航班？")) return;
      standbyData = standbyData.filter(s => s.id !== secId);
      saveStandbyData();
    }

    function openFlightForm(secId, flightId = null) {
      const modal = document.getElementById('flightFormModal');
      const title = document.getElementById('flightFormTitle');
      const formSecId = document.getElementById('formSecId');
      const formFlightId = document.getElementById('formFlightId');
      const nycGroup = document.getElementById('nycAirportSelectGroup');

      formSecId.value = secId;
      formFlightId.value = flightId || '';

      const sec = standbyData.find(s => s.id === secId);
      if (sec && sec.isNyc) {
        nycGroup.classList.remove('hidden');
      } else {
        nycGroup.classList.add('hidden');
      }

      if (flightId) {
        title.innerHTML = '<i data-lucide="edit" class="w-4 h-4 text-sky-400"></i><span>編輯候補航班</span>';
        const flight = sec.flights.find(f => f.id === flightId);
        if (flight) {
          document.getElementById('formAirlineCode').value = flight.airlineCode || '';
          document.getElementById('formFlightNo').value = flight.flightNo || '';
          document.getElementById('formDepTime').value = flight.depTime || '';
          document.getElementById('formTerminal').value = flight.terminal || '';
          document.getElementById('formCheckinTime').value = flight.checkinTime || '';
          document.getElementById('formApt').value = flight.apt || 'EWR';
          autoLookupAirline();
        }
      } else {
        title.innerHTML = '<i data-lucide="plane-takeoff" class="w-4 h-4 text-sky-400"></i><span>新增候補航班</span>';
        document.getElementById('flightForm').reset();
        document.getElementById('formAirlineName').value = '';
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    }

    function closeFlightForm() {
      const modal = document.getElementById('flightFormModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function handleFlightFormSubmit(e) {
      e.preventDefault();
      const secId = document.getElementById('formSecId').value;
      const flightId = document.getElementById('formFlightId').value;

      const sec = standbyData.find(s => s.id === secId);
      if (!sec) return;

      const airlineCode = document.getElementById('formAirlineCode').value.trim().toUpperCase();
      const flightNo = document.getElementById('formFlightNo').value.trim();
      const depTime = document.getElementById('formDepTime').value;
      const terminal = document.getElementById('formTerminal').value.trim();
      let checkinTime = document.getElementById('formCheckinTime').value;
      const apt = document.getElementById('formApt').value;

      if (!checkinTime && depTime) {
        checkinTime = calculateCheckinTime(depTime);
      }

      if (flightId) {
        const flight = sec.flights.find(f => f.id === flightId);
        if (flight) {
          flight.airlineCode = airlineCode;
          flight.flightNo = flightNo;
          flight.depTime = depTime;
          flight.terminal = terminal;
          flight.checkinTime = checkinTime;
          flight.apt = apt;
        }
      } else {
        sec.flights.push({
          id: "f-" + Date.now(),
          airlineCode,
          flightNo,
          depTime,
          terminal,
          checkinTime,
          apt
        });
      }

      saveStandbyData();
      closeFlightForm();
    }

    function deleteFlight(secId, flightId) {
      const sec = standbyData.find(s => s.id === secId);
      if (!sec) return;
      sec.flights = sec.flights.filter(f => f.id !== flightId);
      saveStandbyData();
    }

    function renderStandbyView() {
      const container = document.getElementById('standbySectorsContainer');
      if (!container) return;
      container.innerHTML = '';

      standbyData.forEach((sec, idx) => {
        const theme = sectorColorThemes[idx % sectorColorThemes.length];
        const secCard = document.createElement('div');
        secCard.className = `glass-card rounded-2xl p-4 border ${theme.border} space-y-3 transition-all`;

        const availableAirlines = Array.from(
          new Set(sec.flights.map(f => (f.airlineCode || '').toUpperCase()).filter(Boolean))
        ).sort();

        const availableTerminals = Array.from(
          new Set(sec.flights.map(f => (f.terminal || '').trim()).filter(Boolean))
        ).sort();

        let displayedFlights = [...sec.flights];

        if (sec.isNyc && sec.nycFilter && sec.nycFilter !== "ALL") {
          displayedFlights = displayedFlights.filter(f => f.apt === sec.nycFilter);
        }

        if (sec.airlineFilter && sec.airlineFilter !== "ALL") {
          displayedFlights = displayedFlights.filter(f => (f.airlineCode || '').toUpperCase() === sec.airlineFilter);
        }

        if (sec.terminalFilter && sec.terminalFilter !== "ALL") {
          displayedFlights = displayedFlights.filter(f => (f.terminal || '').trim() === sec.terminalFilter);
        }

        const isExpanded = sec.isExpanded ?? true;

        secCard.innerHTML = `
          <div class="flex items-center justify-between cursor-pointer select-none" onclick="toggleSectorExpand('${sec.id}')">
            <div class="flex items-center gap-2 flex-wrap">
              <i data-lucide="${isExpanded ? 'chevron-down' : 'chevron-right'}" class="w-4 h-4 ${theme.text} transition-transform"></i>
              <h3 class="text-sm font-extrabold ${theme.text} flex items-center gap-1.5">
                <i data-lucide="map-pin" class="w-4 h-4 ${theme.text}"></i>
                <span>${sec.title}</span>
              </h3>
              ${sec.date ? `<span class="text-xs font-bold bg-slate-800 text-slate-200 px-2 py-0.5 rounded-full border border-slate-700">${sec.date}</span>` : ''}
              <span class="text-xs font-bold ${theme.badgeBg} ${theme.text} px-2 py-0.5 rounded-full border ${theme.border}">
                ${displayedFlights.length} / ${sec.flights.length} 班
              </span>
            </div>

            <div class="flex items-center gap-1" onclick="event.stopPropagation()">
              <button onclick="editSectorDate('${sec.id}')" title="修改日期" class="text-slate-300 hover:text-sky-300 p-1.5 rounded-lg text-xs flex items-center gap-0.5 hover:bg-slate-800">
                <i data-lucide="calendar" class="w-4 h-4"></i>
              </button>
              <button onclick="deleteSector('${sec.id}')" class="text-rose-400 hover:text-rose-300 p-1.5 rounded-lg text-xs flex items-center gap-0.5 hover:bg-rose-500/10">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          ${isExpanded ? `
            <div class="mt-3 pt-3 border-t border-slate-800/80 space-y-2.5">
              <div class="space-y-2 bg-slate-900/70 p-3 rounded-xl border border-slate-800">
                <div class="flex items-center gap-1.5">
                  <span class="text-xs font-bold text-sky-400 shrink-0 w-20">航空公司:</span>
                  <div class="flex gap-1 overflow-x-auto hide-scrollbar py-0.5">
                    <button onclick="setAirlineFilter('${sec.id}', 'ALL')" 
                      class="px-2.5 py-1 rounded-full text-xs font-bold transition shrink-0 ${
                        (!sec.airlineFilter || sec.airlineFilter === 'ALL') 
                          ? `${theme.activeTab} pulse-glow` 
                          : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                      }">
                      全部
                    </button>
                    ${availableAirlines.map(code => `
                      <button onclick="setAirlineFilter('${sec.id}', '${code}')" 
                        class="px-2.5 py-1 rounded-full text-xs font-bold transition shrink-0 ${
                          sec.airlineFilter === code 
                            ? `${theme.activeTab} pulse-glow` 
                            : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                        }">
                        ${code}
                      </button>
                    `).join('')}
                  </div>
                </div>

                <div class="flex items-center gap-1.5 pt-1 border-t border-slate-800/60">
                  <span class="text-xs font-bold text-emerald-400 shrink-0 w-20">航廈 Terminal:</span>
                  <div class="flex gap-1 overflow-x-auto hide-scrollbar py-0.5">
                    <button onclick="setTerminalFilter('${sec.id}', 'ALL')" 
                      class="px-2.5 py-1 rounded-full text-xs font-bold transition shrink-0 ${
                        (!sec.terminalFilter || sec.terminalFilter === 'ALL') 
                          ? 'bg-emerald-500 text-slate-950 font-black pulse-glow' 
                          : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                      }">
                      全部
                    </button>
                    ${availableTerminals.map(term => `
                      <button onclick="setTerminalFilter('${sec.id}', '${term}')" 
                        class="px-2.5 py-1 rounded-full text-xs font-bold transition shrink-0 ${
                          sec.terminalFilter === term 
                            ? 'bg-emerald-500 text-slate-950 font-black pulse-glow' 
                            : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                        }">
                        T${term}
                      </button>
                    `).join('')}
                  </div>
                </div>

                ${sec.isNyc ? `
                  <div class="flex items-center gap-1.5 pt-1 border-t border-slate-800/60">
                    <span class="text-xs font-bold text-amber-400 shrink-0 w-20">紐約機場:</span>
                    <div class="flex gap-1 overflow-x-auto hide-scrollbar py-0.5">
                      ${['ALL', 'EWR', 'LGA', 'JFK'].map(apt => `
                        <button onclick="setNycFilter('${sec.id}', '${apt}')" 
                          class="px-2.5 py-1 rounded-full text-xs font-bold transition shrink-0 ${
                            (!sec.nycFilter || sec.nycFilter === apt) 
                              ? 'bg-amber-500 text-slate-950 font-black pulse-glow' 
                              : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                          }">
                          ${apt}
                        </button>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}
              </div>

              <div class="space-y-2 max-h-[420px] overflow-y-auto pr-1">
                ${displayedFlights.length === 0 ? `
                  <div class="p-4 text-center text-xs text-slate-400 bg-slate-900/50 rounded-xl border border-dashed border-slate-800">
                    沒有符合目前篩選條件的候補航班
                  </div>
                ` : displayedFlights.map(f => {
                  const code = (f.airlineCode || '').toUpperCase();
                  const airlineFullName = airlineMapping[code] || f.airline || '其他航空公司';
                  const fullFlightNo = `${code}${f.flightNo || ''}`;

                  return `
                  <div class="p-3.5 bg-slate-900/90 rounded-xl border border-slate-800 flex flex-col gap-2 hover:border-slate-700 transition">
                    <div class="flex justify-between items-start">
                      <div>
                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="text-xs font-extrabold text-white">${airlineFullName}</span>
                          <span class="text-xs font-bold ${theme.text} ${theme.badgeBg} px-2 py-0.5 rounded border ${theme.border}">${fullFlightNo}</span>
                          ${sec.isNyc ? `<span class="text-xs font-bold text-amber-400 bg-amber-500/15 px-2 py-0.5 rounded border border-amber-500/30">${f.apt}</span>` : ''}
                        </div>
                      </div>
                      <div class="flex items-center gap-1.5 shrink-0">
                        <button onclick="openFlightForm('${sec.id}', '${f.id}')" class="p-1.5 text-slate-300 hover:text-sky-300">
                          <i data-lucide="edit-3" class="w-4 h-4"></i>
                        </button>
                        <button onclick="deleteFlight('${sec.id}', '${f.id}')" class="p-1.5 text-slate-300 hover:text-rose-400">
                          <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 text-xs pt-2 border-t border-slate-800/80 text-slate-200">
                      <div><span class="text-slate-400 block text-[11px] mb-0.5">起飛時間 (STD)</span><strong class="text-white text-sm">${f.depTime || '--'}</strong></div>
                      <div><span class="text-slate-400 block text-[11px] mb-0.5">Terminal</span><strong class="text-emerald-300 text-sm font-bold">${f.terminal ? 'T' + f.terminal : '--'}</strong></div>
                      <div><span class="text-slate-400 block text-[11px] mb-0.5">報到/Standby</span><strong class="text-amber-300 text-sm font-bold">${f.checkinTime || '--'}</strong></div>
                    </div>
                  </div>
                  `;
                }).join('')}
              </div>

              <button onclick="openFlightForm('${sec.id}', null)" class="w-full py-2.5 ${theme.btnBg} ${theme.text} border ${theme.border} rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>新增 ${sec.title.split(' ')[0]} 候補航班</span>
              </button>
            </div>
          ` : ''}
        `;

        container.appendChild(secCard);
      });

      lucide.createIcons();
    }

    let currentDayIndex = 0;

    document.addEventListener("DOMContentLoaded", function() {
      lucide.createIcons();
      renderTabs();
      renderDay(currentDayIndex);
      renderChecklist();
      renderHotelsModal();
      renderStandbyView();
    });

    function renderTabs() {
      const container = document.getElementById("dayTabsList");
      if (!container) return;
      container.innerHTML = "";
      
      document.getElementById("tripTotalDaysBadge").innerText = `${tripData.length}-Day Trip`;

      tripData.forEach((data, idx) => {
        const btn = document.createElement("button");
        btn.className = `px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all flex flex-col items-center ${
          idx === currentDayIndex 
            ? "bg-sky-500 text-white pulse-glow" 
            : "bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700"
        }`;
        btn.onclick = () => selectDay(idx);
        btn.innerHTML = `
          <span>Day ${data.day}</span>
          <span class="text-[10px] font-medium opacity-90 mt-0.5">${data.date.split(" ")[0]}</span>
        `;
        container.appendChild(btn);
      });

      // Add Day button at the end of tabs
      const addBtn = document.createElement("button");
      addBtn.className = "px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 flex items-center gap-1 shrink-0 transition";
      addBtn.onclick = addNewDay;
      addBtn.innerHTML = '<i data-lucide="plus" class="w-4 h-4"></i><span>新增天</span>';
      container.appendChild(addBtn);
      lucide.createIcons();
    }

    function selectDay(index) {
      if (index < 0 || index >= tripData.length) return;
      currentDayIndex = index;
      renderTabs();
      renderDay(index);
    }

    function renderDay(index) {
      const data = tripData[index];
      if (!data) return;
      
      document.getElementById("tripProgressText").innerText = `Day ${data.day} / ${tripData.length}`;
      document.getElementById("dayBadge").innerText = `DAY ${data.day} • ${data.date}`;
      document.getElementById("dayTitle").innerText = data.title;
      document.getElementById("dayLocationText").innerText = data.location;
      document.getElementById("hotelText").innerText = data.hotel || '未設定酒店';
      
      const hotelMapBtn = document.getElementById("hotelMapBtn");
      if (data.hotelAddr) {
        hotelMapBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.hotelAddr)}`;
        hotelMapBtn.classList.remove('hidden');
      } else {
        hotelMapBtn.classList.add('hidden');
      }

      const banner = document.getElementById("highlightBanner");
      if (data.highlight) {
        banner.classList.remove("hidden");
      } else {
        banner.classList.add("hidden");
      }

      const timeline = document.getElementById("timelineContainer");
      timeline.innerHTML = "";

      if (!data.events || data.events.length === 0) {
        timeline.innerHTML = `
          <div class="glass-card rounded-xl p-6 text-center text-xs text-slate-400 space-y-2">
            <p>這天還沒有新增任何活動</p>
            <button onclick="openEventModal(${index}, null)" class="px-3 py-1.5 bg-sky-500 text-white rounded-xl font-bold">立即新增活動</button>
          </div>
        `;
        return;
      }

      data.events.forEach((evt, evtIdx) => {
        const item = document.createElement("div");
        item.className = "glass-card rounded-xl p-3.5 flex flex-col space-y-2 hover:border-slate-700 transition";
        
        let iconName = "map-pin";
        let iconBg = "bg-sky-500/15 text-sky-400 border-sky-500/30";
        
        if (evt.tag === "flight") { iconName = "plane"; iconBg = "bg-indigo-500/15 text-indigo-400 border-indigo-500/30"; }
        else if (evt.tag === "hotel") { iconName = "bed"; iconBg = "bg-amber-500/15 text-amber-400 border-amber-500/30"; }
        else if (evt.tag === "food") { iconName = "utensils"; iconBg = "bg-emerald-500/15 text-emerald-400 border-emerald-500/30"; }
        else if (evt.tag === "shopping") { iconName = "shopping-bag"; iconBg = "bg-purple-500/15 text-purple-400 border-purple-500/30"; }
        else if (evt.tag === "heart") { iconName = "heart"; iconBg = "bg-rose-500/15 text-rose-400 border-rose-500/30"; }

        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(evt.location || evt.name)}`;

        item.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-start space-x-3">
              <div class="flex flex-col items-center shrink-0 pt-0.5">
                <span class="text-xs font-bold text-sky-400 mb-1">${evt.time}</span>
                <div class="w-9 h-9 rounded-xl border ${iconBg} flex items-center justify-center">
                  <i data-lucide="${iconName}" class="w-4.5 h-4.5"></i>
                </div>
              </div>
              <div class="min-w-0">
                <h4 class="text-xs font-bold text-white">${evt.name}</h4>
                <p class="text-xs text-slate-300 mt-1 leading-relaxed">${evt.desc || ''}</p>
                ${evt.location ? `
                  <a href="${mapsUrl}" target="_blank" class="inline-flex items-center gap-1.5 mt-2 text-xs text-sky-400 font-semibold hover:underline">
                    <i data-lucide="navigation" class="w-3.5 h-3.5"></i>
                    <span class="truncate">${evt.location}</span>
                  </a>
                ` : ''}
              </div>
            </div>

            <!-- Event Action Buttons -->
            <div class="flex items-center gap-1 shrink-0 bg-slate-900/60 p-1 rounded-xl border border-slate-800">
              ${evtIdx > 0 ? `<button onclick="moveEvent(${index}, ${evtIdx}, -1)" title="向上移動" class="p-1 text-slate-400 hover:text-white"><i data-lucide="chevron-up" class="w-3.5 h-3.5"></i></button>` : ''}
              ${evtIdx < data.events.length - 1 ? `<button onclick="moveEvent(${index}, ${evtIdx}, 1)" title="向下移動" class="p-1 text-slate-400 hover:text-white"><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i></button>` : ''}
              <button onclick="openEventModal(${index}, ${evtIdx})" title="編輯活動" class="p-1 text-slate-300 hover:text-sky-300"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
              <button onclick="deleteEvent(${index}, ${evtIdx})" title="刪除活動" class="p-1 text-rose-400 hover:text-rose-300"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
            </div>
          </div>
        `;
        timeline.appendChild(item);
      });

      lucide.createIcons();
    }

    function jumpToToday() {
      switchView('timeline');
      selectDay(0);
    }

    function renderChecklist() {
      const container = document.getElementById("checklistContainer");
      if (!container) return;
      container.innerHTML = "";
      
      checklistData.forEach(item => {
        const row = document.createElement("div");
        row.className = "flex items-center space-x-3.5 glass-card p-3.5 rounded-xl";
        row.innerHTML = `
          <input type="checkbox" id="${item.id}" ${item.checked ? 'checked' : ''} onchange="toggleCheck('${item.id}')" class="task-checkbox w-4.5 h-4.5 accent-sky-500 rounded border-slate-700 bg-slate-900">
          <label for="${item.id}" class="text-xs text-slate-200 flex-1 font-semibold select-none cursor-pointer leading-snug">${item.text}</label>
        `;
        container.appendChild(row);
      });
    }

    function toggleCheck(id) {
      const target = checklistData.find(c => c.id === id);
      if (target) target.checked = !target.checked;
    }

    function renderHotelsModal() {
      const container = document.getElementById("hotelModalList");
      if (!container) return;
      container.innerHTML = "";
      
      tripData.forEach(d => {
        if (!d.hotel) return;
        const div = document.createElement("div");
        div.className = "glass-card p-4 rounded-xl space-y-1.5";
        div.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <h4 class="text-xs font-bold text-white">Day ${d.day}: ${d.hotel}</h4>
            <span class="text-xs font-semibold text-amber-400 bg-amber-400/15 px-2.5 py-0.5 rounded-full border border-amber-400/30 shrink-0">${d.date}</span>
          </div>
          <p class="text-xs text-slate-300">${d.hotelAddr || '無詳細地址'}</p>
          ${d.hotelAddr ? `
            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.hotelAddr)}" target="_blank" class="inline-flex items-center gap-1.5 text-xs text-sky-400 font-semibold mt-1">
              <i data-lucide="map" class="w-3.5 h-3.5"></i> 地圖導航
            </a>
          ` : ''}
        `;
        container.appendChild(div);
      });
      lucide.createIcons();
    }

    function switchView(view) {
      document.getElementById('viewTimeline').classList.add('hidden');
      document.getElementById('viewStandby').classList.add('hidden');
      document.getElementById('viewHotels').classList.add('hidden');
      document.getElementById('viewChecklist').classList.add('hidden');

      const dayTabs = document.getElementById('dayTabsList');
      const progressText = document.getElementById('tripProgressText');

      ['navTimeline', 'navStandby', 'navHotels', 'navChecklist'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.className = "flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200";
      });

      if (view === 'standby') {
        document.getElementById('viewStandby').classList.remove('hidden');
        document.getElementById('navStandby').className = "flex flex-col items-center space-y-1 text-sky-400";
        document.getElementById('headerPageTitle').innerHTML = '<span>候補機位 Standby</span>';
        dayTabs.classList.add('hidden');
        progressText.classList.add('hidden');
        renderStandbyView();
      } else if (view === 'hotels') {
        document.getElementById('viewHotels').classList.remove('hidden');
        document.getElementById('navHotels').className = "flex flex-col items-center space-y-1 text-sky-400";
        document.getElementById('headerPageTitle').innerHTML = '<span>酒店住宿 Hotels</span>';
        dayTabs.classList.add('hidden');
        progressText.classList.add('hidden');
        renderHotelsModal();
      } else if (view === 'checklist') {
        document.getElementById('viewChecklist').classList.remove('hidden');
        document.getElementById('navChecklist').className = "flex flex-col items-center space-y-1 text-sky-400";
        document.getElementById('headerPageTitle').innerHTML = '<span>出發備忘 Checklist</span>';
        dayTabs.classList.add('hidden');
        progressText.classList.add('hidden');
      } else {
        document.getElementById('viewTimeline').classList.remove('hidden');
        document.getElementById('navTimeline').className = "flex flex-col items-center space-y-1 text-sky-400";
        document.getElementById('headerPageTitle').innerHTML = '<span>🇺🇸 美國之旅 2026</span>';
        dayTabs.classList.remove('hidden');
        progressText.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
